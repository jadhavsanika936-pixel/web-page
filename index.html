<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Practice</title>
</head>
<body style="background-color: #e6f2ff;">

    <h1 style="color: red; font-size: 50px; text-align: center;">
        Inline CSS Styling Example
    </h1>

    <p style="color: blue; font-size: 20px;">
        This paragraph has blue text and medium font size.
    </p>

    <p style="color: green; font-size: 25px; background-color: lightyellow;">
        This paragraph has green text with a yellow background.
    </p>

    <p style="color: white; font-size: 18px; background-color: black;">
        White text on a black background.backgroung
    </p>

    <div style="background-color: pink; padding: 15px;">
        <p style="color: purple; font-size: 22px;">
            This text is inside a pink box with padding.
        </p>
    </div>

    <h2 style="color: orange; font-size: 35px;">
        Subheading with different style
    </h2>

    <button style="background-color: green; color: white; font-size: 18px; padding: 10px; border-radius: 8px;">
        Styled Button
    </button>

</body>
</html>
